  <script>
    let currentScale = 0.5;

    // 自動適應引擎：將縮放基準改為「正中心」，確保縮放時上下左右均勻對稱
    function autoFitLayout() {
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      
      const baseWidth = 1550;
      const baseHeight = 900;
      
      let scaleX = (screenWidth - 20) / baseWidth;
      let scaleY = (screenHeight - 20) / baseHeight;
      
      let calculatedScale = Math.min(scaleX, scaleY);
      
      if (calculatedScale > 0.95) calculatedScale = 0.95;
      if (calculatedScale < 0.2) calculatedScale = 0.2;
      
      manualZoom(calculatedScale);
    }

    function manualZoom(val) {
      currentScale = parseFloat(val);
      const row = document.getElementById('mainLayoutRow');
      if (row) {
        // ★ 核心修復：將縮放原點從 top center 改為 center center，徹底解決向上飄移的問題
        row.style.transformOrigin = 'center center';
        row.style.transform = `scale(${currentScale})`;
      }
    }

    // 支援電腦端 Ctrl + 滾輪縮放
    window.addEventListener('wheel', (e) => {
      if (e.ctrlKey) {
        e.preventDefault();
        let newScale = currentScale + (e.deltaY < 0 ? 0.03 : -0.03);
        if (newScale < 0.2) newScale = 0.2;
        if (newScale > 1.2) newScale = 1.2;
        
        manualZoom(newScale);
      }
    }, { passive: false });

    window.addEventListener('load', () => {
      setTimeout(() => {
        window.scrollTo(0, 0);
        autoFitLayout();
      }, 100);
    });

    window.addEventListener('resize', () => {
      autoFitLayout();
    });
  </script>
